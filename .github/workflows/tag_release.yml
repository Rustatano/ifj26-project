name: Makefile CI

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  compile:
    uses: ./.github/workflows/merge_make.yml

  release:
    needs: compile
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download C build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-asset-c

      - name: Download doc build artifact
        uses: actions/download-artifact@v4
        with:
          name: release-asset-doc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ifj26
            main.pdf
          generate_release_notes: true
