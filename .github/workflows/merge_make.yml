name: Makefile CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  build-c-archive:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-16

      - name: Build
        run: make build

      - name: Archive
        run: make archive

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-archive
          path: xsvoboj01.zip

  build-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: dokumentace.tex
          working_directory: doc
          compiler: latexmk
          args: -pdf -interaction=nonstopmode -outdir=build

  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-16
          sudo apt-get install libcmocka-dev
          sudo apt-get install cmocka-doc

      - name: Run tests
        run: make test
