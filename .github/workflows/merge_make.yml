name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  build-c:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential software-properties-common
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y gcc-16

    - name: Build
      run: make build

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-asset-c
        path: ifj26

  build-doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: doc
          compiler: latexmk
          args: -pdf -outdir=build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-doc
          path: doc/build/main.pdf
